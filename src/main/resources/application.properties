spring.application.name=backend

# Server Configuration
server.port=${PORT:8080}

# MySQL Connection Configured with your MySQL Password (1885)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techzyncmedia_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1885}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Dev support)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}